name: Build and Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore LicenseManagement.EndUser/LicenseManagement.EndUser.csproj -PackagesDirectory packages

    - name: Build library
      run: msbuild LicenseManagement.EndUser/LicenseManagement.EndUser.csproj /p:Configuration=Release /p:Platform=AnyCPU

    - name: Restore test project
      run: nuget restore LicenseManagement.EndUser.Test/LicenseManagement.EndUser.Test.csproj -PackagesDirectory packages

    - name: Build test project
      run: msbuild LicenseManagement.EndUser.Test/LicenseManagement.EndUser.Test.csproj /p:Configuration=Release

    # TESTS DISABLED IN CI — all 62 tests are integration tests that require a live backend.
    #
    # The test project (LicenseManagement.EndUser.Test) talks to a locally-running ASP.NET
    # web app (audit-fix repo, http://localhost:7298/api/) backed by a SQL database seeded
    # by the TestSetup project in that same repo.  There is no unit-test layer that can run
    # in a sandboxed GitHub Actions runner without that infrastructure.
    #
    # To enable tests in CI you will need to:
    #   1. Add the audit-fix repo (the server) as a Git submodule or a separate checkout step.
    #   2. Run the TestSetup project to create and seed the database
    #      (it regenerates the RSA signing key-pair and the SQL seed data on every run).
    #   3. Start the web app in the background:
    #         dotnet run --project audit-fix/LicenseManagement --launch-profile Http &
    #      and wait for it to be healthy (e.g. curl http://localhost:7298/api/PublicKey).
    #   4. Re-enable the step below (remove the `if: false` guard).
    #
    # Locally, run tests against a running server with:
    #   dotnet test LicenseManagement.EndUser.Test/LicenseManagement.EndUser.Test.csproj \
    #     --configuration Release --logger "console;verbosity=normal"
    - name: Run tests (disabled — integration tests require local server)
      if: false
      run: dotnet test LicenseManagement.EndUser.Test/LicenseManagement.EndUser.Test.csproj --configuration Release --no-build --logger "console;verbosity=normal"
