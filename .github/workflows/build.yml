name: Build and Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore LicenseManagement.EndUser/LicenseManagement.EndUser.csproj -PackagesDirectory packages

    - name: Build library
      run: msbuild LicenseManagement.EndUser/LicenseManagement.EndUser.csproj /p:Configuration=Release /p:Platform=AnyCPU

    - name: Restore test project
      run: nuget restore LicenseManagement.EndUser.Test/LicenseManagement.EndUser.Test.csproj -PackagesDirectory packages

    - name: Build test project
      run: msbuild LicenseManagement.EndUser.Test/LicenseManagement.EndUser.Test.csproj /p:Configuration=Release

    # Actually executes the tests (the previous "Run Tests" step only msbuilt them).
    # Integration tests that depend on a local TestServer at http://localhost:7298/api/
    # will fail in CI until that server is spun up as part of the workflow or those
    # tests are filtered/marked. Failures here are real and should not be hidden.
    - name: Run tests
      run: dotnet test LicenseManagement.EndUser.Test/LicenseManagement.EndUser.Test.csproj --configuration Release --no-build --logger "console;verbosity=normal"
